name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Workspace Verification & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Corepack
        run: corepack enable

      - name: Verify pnpm version
        run: corepack pnpm --version

      - name: Verify Monorepo Workspace
        run: corepack pnpm -r exec node -e "console.log(process.cwd())"
